<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>US Small Caps Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        h2 { color: #00ffcc; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { padding: 12px; border: 1px solid #333; text-align: center; }
        th { background-color: #252525; color: #00ffcc; }
        tr:hover { background-color: #2a2a2a; }
        .no-data { text-align: center; font-size: 18px; color: #888; margin-top: 40px; }
    </style>
</head>
<body>

    <h2>الأسهم الأمريكية (Small Caps)</h2>

    {% if stocks %}
    <table>
        <thead>
            <tr>
                <th>الرمز (Symbol)</th>
                <th>الاسم (Name)</th>
                <th>السعر (Price)</th>
                <th>الإشارة (Signal)</th>
            </tr>
        </thead>
        <tbody>
            {% for stock in stocks %}
            <tr>
                <td><b>{{ stock.symbol }}</b></td>
                <td>{{ stock.name }}</td>
                <td>{{ stock.price }}</td>
                <td style="color: #00ffcc;">{{ stock.signal }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <div class="no-data">لا توجد بيانات حالياً... انتظر التحديث القادم!</div>
    {% endif %}

</body>
</html>
