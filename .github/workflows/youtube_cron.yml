
name: YouTube to Scanner Auto Bot

on:
  schedule:
    # بيشتغل أوتوماتيك كل نص ساعة
    - cron: '*/30 * * * *'
  workflow_dispatch: # زرار للتشغيل اليدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run YouTube processing script
        run: python youtube_scanner.py
      - name: Install dependencies
        run: pip install requests

      - name: Run YouTube processing script
        run: python youtube_scanner.py
